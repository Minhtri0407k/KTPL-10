
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>KTPL 10 - Góc hỏi đáp</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(720px, 100%);
      margin: auto;
      padding: 22px 16px 50px;
    }

    header { margin-bottom: 22px; }

    header h1 {
      color: #2563eb;
      font-size: 27px;
      margin: 0 0 5px;
    }

    header p {
      color: #64748b;
      margin: 0;
      font-size: 14px;
    }

    .panel {
      background: white;
      border: 1px solid #e5eaf2;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin: 13px 0 7px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d7deea;
      border-radius: 9px;
      font: inherit;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus, textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      margin-top: 15px;
      color: white;
      background: #2563eb;
    }

    .primary:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary {
      color: #1d4ed8;
      background: #eff6ff;
    }

    .danger {
      color: #b91c1c;
      background: #fee2e2;
    }

    .muted {
      color: #64748b;
      font-size: 13px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .topline h2 { margin: 0; }

    .count {
      color: #64748b;
      font-size: 13px;
    }

    .question {
      border: 1px solid #e5eaf2;
      border-radius: 12px;
      background: white;
      padding: 15px;
      margin-bottom: 11px;
    }

    .question-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .class-tag {
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 20px;
      padding: 5px 9px;
      font-size: 12px;
      white-space: nowrap;
    }

    .question h3 {
      font-size: 16px;
      line-height: 1.45;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }

    .question-meta {
      color: #64748b;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .admin-tools {
      display: none;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      padding: 13px;
      border-radius: 11px;
      margin-bottom: 13px;
    }

    .admin-tools.active { display: block; }

    .admin-tools .actions { margin-top: 10px; }

    .admin-check {
      width: 18px;
      height: 18px;
      accent-color: #2563eb;
    }

    .empty {
      text-align: center;
      padding: 28px 12px;
      color: #64748b;
      background: white;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
    }

    #status {
      font-size: 13px;
      margin-top: 10px;
      color: #64748b;
    }

    .admin-entry {
      text-align: center;
      margin-top: 25px;
    }

    .admin-entry button {
      color: #64748b;
      background: transparent;
      text-decoration: underline;
    }

    @media (max-width: 420px) {
      .container { padding: 18px 12px 40px; }
      .panel { padding: 15px; }
    }
  </style>
</head>

<body>
<main class="container">

  <header>
    <h1>KTPL 10</h1>
    <p>Góc hỏi đáp và chia sẻ câu hỏi của lớp</p>
  </header>

  <section class="panel">
    <h2>Đăng câu hỏi</h2>

    <form id="questionForm">
      <label for="className">Tên lớp</label>
      <input id="className" maxlength="30"
        placeholder="Ví dụ: 10TH1" required>

      <label for="name">Tên người gửi</label>
      <input id="name" maxlength="50"
        placeholder="Nhập họ và tên" required>

      <label for="question">Nội dung câu hỏi</label>
      <textarea id="question" maxlength="1500"
        placeholder="Nhập câu hỏi của bạn..." required></textarea>

      <button class="primary" id="submitBtn" type="submit">
        Gửi câu hỏi
      </button>

      <div id="status" role="status"></div>
    </form>
  </section>

  <section>
    <div class="topline">
      <h2>Danh sách câu hỏi</h2>
      <span class="count" id="count">Đang tải...</span>
    </div>

    <div class="admin-tools" id="adminTools">
      <strong>Chế độ quản trị</strong>
      <div class="muted">Chọn câu hỏi cần xóa hoặc sao chép.</div>

      <div class="actions">
        <button class="secondary" id="selectAllBtn">Chọn tất cả</button>
        <button class="secondary" id="copySelectedBtn">Sao chép đã chọn</button>
        <button class="danger" id="deleteSelectedBtn">Xóa đã chọn</button>
        <button class="secondary" id="logoutBtn">Thoát</button>
      </div>
    </div>

    <div id="questionList">
      <div class="empty">Đang tải câu hỏi...</div>
    </div>
  </section>

  <div class="admin-entry">
    <button id="adminBtn">Khu vực quản trị lớp</button>
  </div>

</main>

<script>
  const API = "/api/questions";

  let questions = [];
  let adminToken = sessionStorage.getItem("ktpl_admin_token") || "";
  let adminMode = false;

  const $ = id => document.getElementById(id);

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function dateText(value) {
    if (!value) return "";
    const date = new Date(String(value).replace(" ", "T") + "Z");
    if (Number.isNaN(date.getTime())) return escapeHTML(value);
    return date.toLocaleString("vi-VN");
  }

  async function loadQuestions() {
    try {
      const response = await fetch(API, { cache: "no-store" });
      const data = await response.json();

      if (!response.ok) throw new Error(data.error || "Không tải được dữ liệu.");

      questions = data.questions || [];
      renderQuestions();
    } catch (error) {
      $("count").textContent = "Lỗi tải dữ liệu";
      $("questionList").innerHTML =
        '<div class="empty">Không thể tải câu hỏi. Vui lòng thử tải lại trang.</div>';
    }
  }

  function questionText(q) {
    return `Lớp: ${q.class_name || "Chưa ghi lớp"}\n` +
      `Người gửi: ${q.name}\n\n` +
      `Câu hỏi: ${q.question}`;
  }

  function renderQuestions() {
    $("count").textContent = `${questions.length} câu hỏi`;

    if (!questions.length) {
      $("questionList").innerHTML =
        '<div class="empty">Chưa có câu hỏi nào. Hãy là người đầu tiên gửi câu hỏi nhé!</div>';
      return;
    }

    $("questionList").innerHTML = questions.map(q => `
      <article class="question">
        <div class="question-top">
          <div>
            ${adminMode
              ? `<input class="admin-check" type="checkbox" value="${Number(q.id)}" aria-label="Chọn câu hỏi">`
              : ""}
          </div>
          <span class="class-tag">${escapeHTML(q.class_name || "Chưa ghi lớp")}</span>
        </div>

        <h3>${escapeHTML(q.question)}</h3>

        <div class="question-meta">
          ${escapeHTML(q.name)} · ${dateText(q.created_at)}
        </div>

        <div class="actions">
          <button class="secondary copy-one" data-id="${Number(q.id)}">
            Sao chép
          </button>
          ${adminMode ? `
            <button class="danger delete-one" data-id="${Number(q.id)}">
              Xóa câu hỏi
            </button>
          ` : ""}
        </div>
      </article>
    `).join("");
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      alert("Đã sao chép!");
    } catch {
      const area = document.createElement("textarea");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      const success = document.execCommand("copy");
      area.remove();
      alert(success ? "Đã sao chép!" : "Không thể sao chép trên trình duyệt này.");
    }
  }

  $("questionForm").addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("submitBtn");
    button.disabled = true;
    button.textContent = "Đang gửi...";
    $("status").textContent = "";

    try {
      const response = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          className: $("className").value,
          name: $("name").value,
          question: $("question").value
        })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Gửi câu hỏi thất bại.");

      $("question").value = "";
      $("status").textContent = "Đã gửi câu hỏi thành công!";
      await loadQuestions();
    } catch (error) {
      $("status").textContent = error.message;
    } finally {
      button.disabled = false;
      button.textContent = "Gửi câu hỏi";
    }
  });

  $("questionList").addEventListener("click", async event => {
    const copyButton = event.target.closest(".copy-one");
    const deleteButton = event.target.closest(".delete-one");

    if (copyButton) {
      const q = questions.find(item => Number(item.id) === Number(copyButton.dataset.id));
      if (q) await copyText(questionText(q));
    }

    if (deleteButton) {
      const id = Number(deleteButton.dataset.id);
      if (!confirm("Ông có chắc muốn xóa câu hỏi này không?")) return;
      await deleteQuestions([id]);
    }
  });

  function setAdminMode(enabled) {
    adminMode = enabled;
    $("adminTools").classList.toggle("active", enabled);
    $("adminBtn").textContent = enabled
      ? "Đang ở chế độ quản trị"
      : "Khu vực quản trị lớp";
    renderQuestions();
  }

  $("adminBtn").addEventListener("click", async () => {
    if (adminMode) return;

    const token = prompt("Nhập mã quản trị lớp:");
    if (!token) return;

    adminToken = token;

    // Kiểm tra mã bằng một yêu cầu xóa không có ID hợp lệ.
    // API sẽ trả 400 nếu mã đúng, 401 nếu mã sai.
    try {
      const response = await fetch(API, {
        method: "DELETE",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${adminToken}`
        },
        body: JSON.stringify({ ids: [] })
      });

      if (response.status === 401) {
        alert("Mã quản trị không đúng.");
        adminToken = "";
        return;
      }

      if (response.status !== 400) {
        alert("Không xác minh được quyền quản trị. Hãy thử lại.");
        return;
      }

      sessionStorage.setItem("ktpl_admin_token", adminToken);
      setAdminMode(true);
    } catch {
      alert("Không thể kết nối máy chủ.");
    }
  });

  async function deleteQuestions(ids) {
    if (!adminToken || !adminMode) {
      alert("Ông cần đăng nhập quản trị trước.");
      return;
    }

    try {
      const response = await fetch(API, {
        method: "DELETE",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${adminToken}`
        },
        body: JSON.stringify({ ids })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Xóa thất bại.");

      alert(`Đã xóa ${data.deleted} câu hỏi.`);
      await loadQuestions();
    } catch (error) {
      alert(error.message);
    }
  }

  $("selectAllBtn").addEventListener("click", () => {
    document.querySelectorAll(".admin-check").forEach(box => {
      box.checked = true;
    });
  });

  $("copySelectedBtn").addEventListener("click", async () => {
    const ids = [...document.querySelectorAll(".admin-check:checked")]
      .map(box => Number(box.value));

    const selected = questions.filter(q => ids.includes(Number(q.id)));

    if (!selected.length) {
      alert("Ông chưa chọn câu hỏi nào.");
      return;
    }

    await copyText(selected.map(questionText).join("\n\n--------------------\n\n"));
  });

  $("deleteSelectedBtn").addEventListener("click", async () => {
    const ids = [...document.querySelectorAll(".admin-check:checked")]
      .map(box => Number(box.value));

    if (!ids.length) {
      alert("Ông chưa chọn câu hỏi nào.");
      return;
    }

    if (!confirm(`Xóa ${ids.length} câu hỏi đã chọn?`)) return;
    await deleteQuestions(ids);
  });

  $("logoutBtn").addEventListener("click", () => {
    adminToken = "";
    sessionStorage.removeItem("ktpl_admin_token");
    setAdminMode(false);
  });

  loadQuestions();
  setInterval(loadQuestions, 20000);
</script>
</body>
</html>
